<main aria-live="polite" class="coming-page" data-view="{{COMING_VIEW}}">
  <div class="container coming-layout">
    <div class="coming-text">
      <div class="eyebrow micro">ANTIKPOKER · В РАЗРАБОТКЕ</div>
      <h1>{{COMING_TITLE}}</h1>
      <p>{{COMING_DESCRIPTION}}</p>
      <div class="coming-note"><span class="coming-dot"></span><span>{{COMING_NOTE}}</span></div>
      <a class="btn btn-primary" href="/">← На главную</a>
    </div>
    <div aria-hidden="true" class="coming-art has-photo" data-variant="{{COMING_VIEW}}">
      <div class="coming-halo"></div><div class="coming-glyph">A</div>
      <div class="coming-photo-shell">
        <div class="coming-photo-header"><span class="coming-photo-symbol">A</span><span class="coming-photo-head-label">{{COMING_LABEL}}</span><span class="coming-photo-tag">ANTIKPOKER</span></div>
        <div class="coming-photo-picture"><img alt="" decoding="async" src="{{COMING_IMAGE}}"></div>
        <div class="coming-photo-footer"><div><strong>{{COMING_CARD_TITLE}}</strong><small>{{COMING_CARD_SUBTITLE}}</small></div><span class="coming-photo-emblem">{{COMING_EMBLEM}}</span></div>
      </div>
      <div class="coming-float coming-one">♠ Комнаты</div>
      <div class="coming-float coming-two">🏆 Турниры</div>
      <div class="coming-float coming-three">✦ Свой стиль</div>
    </div>
  </div>
</main>
